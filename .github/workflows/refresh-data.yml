name: refresh-data

on:
  # Schedule disabled 2026-06-05: CARB's CloudFront 403s GitHub Actions
  # runner IPs. The refresh now runs weekly via cron on armazi
  # (~/bin/carbon-dashboard-refresh.sh), which pushes data commits here.
  # Kept as workflow_dispatch in case CARB unblocks datacenter IPs.
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Run fetchers
        run: |
          python3 data/fetchers/california_auctions.py

      - name: Commit and push if data changed
        run: |
          git config user.name "carbon-dashboard-bot"
          git config user.email "carbon-dashboard-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh from upstream sources [skip ci]"
            git push
          fi
